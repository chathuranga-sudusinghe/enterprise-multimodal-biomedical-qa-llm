# Dataset configuration for local inspection and planned later experiments.
# Raw datasets are not committed to Git; access and license terms require review.

datasets:
  download_enabled: false
  primary_text_dataset: "PubMedQA"
  primary_image_text_dataset: "SLAKE"
  backup_image_text_dataset: "PathVQA"
  optional_later_modalities:
    - "licensed_video_if_reviewed_and_useful"
    - "licensed_audio_if_reviewed_and_useful"
  local_raw_paths:
    pubmedqa: "data/raw/pubmedqa/"
    slake: "data/raw/slake/"
    pathvqa: "data/raw/pathvqa/"
  require_license_review: true
  raw_datasets_committed_to_git: false
  private_patient_data_allowed: false
