# Safety policy configuration placeholder.

safety:
  boundary: "educational_research_biomedical_qa_only"
  diagnosis_allowed: false
  treatment_decision_allowed: false
  patient_specific_medical_advice_allowed: false
  prescription_guidance_allowed: false
  replacement_for_medical_professionals_allowed: false
  require_uncertainty_when_evidence_is_insufficient: true
  separate_evidence_from_interpretation: true
  private_patient_data_allowed: false
  raw_datasets_committed_to_git: false
