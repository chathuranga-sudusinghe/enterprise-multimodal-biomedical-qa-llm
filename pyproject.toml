[project]
name = "enterprise-multimodal-biomedical-qa-llm"
version = "0.1.0"
description = "Research-oriented biomedical QA fine-tuning portfolio with dataset inspection and a unified QA schema."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Project Team" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py310"]
